# Dependabot VERSION updates — this file's presence on main is the enable
# switch; no settings toggle involved. Cadence and guards are a per-repo
# choice. cooldown mirrors the local npm guard (min-release-age=3 in ~/.npmrc).
#
# Comments here only explain the config lines next to them. Repo-settings
# toggles, review traps for bump PRs and other learnings live in
# .github/MAINTENANCE.md: any edit to this file on main makes Dependabot
# re-check every ecosystem, so this file changes only when the config does.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # one weekly PR for all minor+patch bumps; majors arrive individually
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # vue-tsc can't type-check under TS 7.0 (the native/tsgo port);
      # Vue language-tools support expected around TS 7.1 —
      # https://github.com/vuejs/language-tools/issues/5381
      # Range (not the whole major) so 7.1 DOES get proposed when it ships.
      # Still current as of 2026-07-31 (latest = 7.0.2, 7.1 dev-only).
      - dependency-name: typescript
        versions: ["7.0.x"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # Most versions are managed by the spring-boot-starter-parent, so the
    # meaningful PR volume is: parent bumps + springdoc + testcontainers.
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  # The two RUNTIME base images (eclipse-temurin, nginx/nginx-unprivileged)
  # are pinned by digest in the Dockerfiles (nginx next to its full version
  # tag, the JRE next to its channel tag), so a base update arrives here as
  # a PR: a new patch release, or a rebuild of the same version for
  # OS-package fixes (the digest moves, the tag may not). With a
  # floating tag the same update rode along unseen with whatever build came
  # next — and nothing said that a build was worth deploying for it. The
  # backend's BUILD stage is pinned the same way (eclipse-temurin 21-jdk; its
  # Maven comes from the wrapper, which the maven ecosystem above covers).
  # The frontend's build image (node) floats within its major: it is not
  # part of what runs. Which channel is a decision made by hand; the ignore
  # rules below keep Dependabot from proposing a move.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    ignore:
      # temurin majors = Java version decisions (ADR-worthy), kept in sync
      # between both FROM lines of backend/Dockerfile (21-jdk, 21-jre),
      # pom.xml <java.version> and setup-java in CI
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
      # node: stays on the chosen major, kept in sync with setup-node's
      # node-version in frontend.yml and package.json engines
      - dependency-name: node
        update-types:
          - version-update:semver-major
      # nginx: 1.30 is the STABLE line (even minor) — security and serious
      # bug fixes only, and the config here needs no newer features. A minor
      # move (1.30 → 1.32 when stable rolls over, about once a year in
      # spring) or a switch to mainline (odd minor) is a channel decision.
      - dependency-name: nginx/nginx-unprivileged
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # cooldown supports default-days only for github-actions (docs, 2026-10-29)
  # Actions are SHA-pinned with version comments; Dependabot bumps both.
  # NOT Dependabot's territory: node-version/java-version `with:` inputs
  # in the workflows — those stay manual.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
