# Dependabot VERSION updates — this file's presence on main is the enable
# switch; no settings toggle involved. Cadence and guards are a per-repo
# choice. cooldown mirrors the local npm guard (min-release-age=3 in ~/.npmrc).
#
# Deliberately NOT covered here — repo-settings toggles, verified 2026-09-06:
# * Dependabot ALERTS: on. They are the signal for transitive CVEs, which
#   nothing in this file ever fixes (Dependabot can't refresh in-range
#   transitives for npm — a version-bump PR never drags a fix along).
#   An alert = likely manual `npm update <transitive>` (see PR #19, #30).
# * Dependabot SECURITY-UPDATE PRs: off, on purpose. They ignore cooldown
#   and bump straight to latest, i.e. they systematically break the 3-day
#   guard even when no bump to latest is needed. Keep them off.
# * Docker base images never get alerts at all (not in the dependency
#   graph) — for a critical nginx/temurin advisory, bump manually.
#
# ── Review traps for bump PRs in THIS repo ──────────────────────────────
# * docker bumps + action bumps inside build-and-push: PR CI runs the
#   verify jobs only — images are built AFTER merge to main, so a broken
#   base-image or buildx bump merges green. Pre-merge proof: push the PR
#   head to build-image/<name>, then `gh workflow run backend.yml --ref
#   build-image/<name>` (+ frontend.yml). Always dispatch: it is the one
#   trigger in those workflows without a `paths:` filter.
# * springdoc majors track Spring Boot majors — a springdoc major PR only
#   makes sense together with the matching Boot line.
# * Boot minors/majors can relocate classes/packages (seen live: 4.1 moved
#   TestRestTemplate). `./mvnw verify` in PR CI catches it at compile time;
#   expect occasional import-fix commits on top of Boot bump PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # one weekly PR for all minor+patch bumps; majors arrive individually
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # vue-tsc can't type-check under TS 7.0 (the native/tsgo port);
      # Vue language-tools support expected around TS 7.1 —
      # https://github.com/vuejs/language-tools/issues/5381
      # Range (not the whole major) so 7.1 DOES get proposed when it ships.
      # Still current as of 2026-07-31 (latest = 7.0.2, 7.1 dev-only).
      # (Sister repos also ignore vite majors — NOT carried here: that
      # guard is electron-vite peer-range specific; this repo runs vite 8.)
      - dependency-name: typescript
        versions: ["7.0.x"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # Most versions are managed by the spring-boot-starter-parent, so the
    # meaningful PR volume is: parent bumps + springdoc + testcontainers.
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  # Tag moves are channel/major decisions made deliberately; digest bumps
  # within pinned tags would be Dependabot's job, but tags here float by
  # design (21-jre, 26-alpine, alpine-slim) — so this section mostly guards
  # against major-noise and documents the channel choices.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 3
    ignore:
      # temurin majors = Java version decisions (ADR-worthy),
      # kept in sync with pom.xml <java.version> and setup-java in CI
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
      # maven build image: Dependabot parses the compound tag so a temurin
      # suffix move (3.9-eclipse-temurin-21 → 3-eclipse-temurin-26) arrives
      # as a non-major "3.9 → 3" bump — i.e. a silent JDK switch (PR #1,
      # closed). JDK channel is deliberate and synced with pom + runtime
      # image: ignore ALL updates here, bumps are manual.
      - dependency-name: maven
      # node: stays on the chosen major, kept in sync with setup-node's
      # node-version in frontend.yml and package.json engines
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # cooldown is unsupported for github-actions (docs, 2026-07-26) —
  # weekly cadence + review-before-merge is the age guard here.
  # Actions are SHA-pinned with version comments; Dependabot bumps both.
  # NOT Dependabot's territory: node-version/java-version `with:` inputs
  # in the workflows — those stay manual.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Vienna
