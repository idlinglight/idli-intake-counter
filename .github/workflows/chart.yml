name: chart

# Lints and template-renders the chart on every relevant change; publishes it
# on main to oci://ghcr.io/<owner>/charts as idli-intake-counter:<Chart.yaml version>.
# The chart version is bumped manually (ADR-0003); re-publishing an unchanged
# version overwrites the artifact, so meaningful changes need a version bump.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/chart/**'
      - '.github/workflows/chart.yml'
  pull_request:
    paths:
      - 'deploy/chart/**'
      - '.github/workflows/chart.yml'
  workflow_dispatch:

# Least privilege by default; only the job that pushes the chart widens it.
permissions:
  contents: read

env:
  CHART_DIR: deploy/chart/idli-intake-counter
  # The chart refuses to render without a datasource (deliberate guard);
  # lint/template therefore inject sample values.
  DS_VALUES: backend.env=[{"name":"SPRING_DATASOURCE_URL","value":"jdbc:postgresql://db:5432/idli"},{"name":"IDLI_AUTH_PASSWORD_HASH","value":"placeholder"}]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — nothing after the checkout talks to git;
      # don't leave the token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint "$CHART_DIR" --set-json "$DS_VALUES"
      - run: helm template smoke "$CHART_DIR" --set-json "$DS_VALUES" > /dev/null
      # The digest-pinned form of the image references is a template branch the
      # default values never take; render it, and check it came out as
      # repository@digest for both components.
      - name: Render with image digests
        run: |
          digest="sha256:$(printf '%064d' 0)"
          helm template smoke "$CHART_DIR" --set-json "$DS_VALUES" \
            --set backend.image.digest="$digest" --set frontend.image.digest="$digest" \
            | grep -c "@${digest}\"" | grep -qx 2

  publish:
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level set, hence both lines.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          helm package "$CHART_DIR" -d /tmp/chart-pkg
          helm push /tmp/chart-pkg/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
