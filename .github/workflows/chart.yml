name: chart

# Lints and template-renders the chart on every relevant change; publishes it
# on main to oci://ghcr.io/<owner>/charts as idli-intake-counter:<Chart.yaml version>.
# The chart version is bumped manually (ADR-0003); re-publishing an unchanged
# version overwrites the artifact, so meaningful changes need a version bump.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/chart/**'
      - '.github/workflows/chart.yml'
  pull_request:
    paths:
      - 'deploy/chart/**'
      - '.github/workflows/chart.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: deploy/chart/idli-intake-counter

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint "$CHART_DIR"
      - run: helm template smoke "$CHART_DIR" > /dev/null

  publish:
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          helm package "$CHART_DIR" -d /tmp/chart-pkg
          helm push /tmp/chart-pkg/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
