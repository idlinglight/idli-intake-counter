server {
    # 8080, not 80: the image runs as a non-root user (see Dockerfile), and the
    # chart's containerPort follows this line.
    listen 8080;
    server_name _;

    # Don't advertise the exact nginx version (Server header, error pages).
    server_tokens off;
    # TLS terminates at the ingress, so nginx only ever sees plain http and
    # would build absolute redirects (the trailing-slash 301 for directories)
    # as http://…. Relative ones stay on the scheme the client actually used.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # The API's responses get their security headers from Spring Security;
    # the SPA shell and the static assets are served by nginx alone, so they
    # need their own. "always" = on error responses too. NB add_header is
    # inherited only by blocks that declare none themselves — a location that
    # adds a header of its own must repeat these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Probe target (the chart's readinessProbe), kept out of the access log: a
    # probe every ten seconds is 8640 log lines a day that say nothing. It
    # answers with the SPA shell itself — 200 only if index.html is there and
    # readable, 503 if not — so "Ready" still means "can serve the app", as it
    # did when the probe asked for "/". "=" is an exact match: only this one
    # path gets the special treatment. Through the ingress it shows what "/"
    # shows.
    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }
}
