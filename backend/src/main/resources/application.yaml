spring:
  application:
    name: idli-backend
  # Datasource credentials are intentionally not hardcoded here.
  # Local dev: spring-boot-docker-compose picks them up from compose.yaml.
  # Tests: Testcontainers provides them via @ServiceConnection.
  # Production: supply SPRING_DATASOURCE_URL/USERNAME/PASSWORD via environment.

management:
  endpoint:
    health:
      probes:
        enabled: true

---
# nodb: walking-skeleton profile — lets the app run while no database is
# deployed yet. Dropped once the database step lands (ADR-0004).
# FQCNs are Boot 4's relocated autoconfigure packages; NoDbProfileTest
# guards them (a typo here is silently ignored by Spring, not an error).
spring:
  config:
    activate:
      on-profile: nodb
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
