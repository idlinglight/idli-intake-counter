spring:
  application:
    name: idli-backend
  jackson:
    deserialization:
      # Jackson's default coerces 30.5 into a Long field as 30 — a silently
      # truncated amount on authoring and, worse, on restore (ADR-0007 promises
      # rejections stay loud). Off: fractional JSON numbers for integer fields
      # are a 400, not a rounding.
      accept-float-as-int: false
  web:
    error:
      # The default ("never") strips exception messages from error bodies.
      # The import 400s carry the actionable reason (unsupported formatVersion,
      # unknown metric, …) — on the recovery gesture, a bare status code is not
      # a diagnosis. All messages here are ours and secret-free. NB Boot 4
      # moved this here from the classic server.error.* prefix (BasicErrorController
      # binds WebProperties; server.error.* silently no-ops for MVC bodies).
      include-message: always
  # Datasource credentials are intentionally not hardcoded here.
  # Local dev: spring-boot-docker-compose picks them up from compose.yaml.
  # Tests: Testcontainers provides them via @ServiceConnection.
  # Production: supply SPRING_DATASOURCE_URL/USERNAME/PASSWORD via environment.

idli:
  # Timezone that defines the day boundary for /api/days/{date}.
  zone: Europe/Vienna
  # idli.auth.password-hash (env IDLI_AUTH_PASSWORD_HASH) intentionally has no
  # default here: like the datasource credentials, the app must fail to start
  # without it. Value is the bare bcrypt hash of the single login password
  # (ADR-0005); mint one with scripts/mint-auth-hash.sh.

server:
  # TLS terminates at the ingress. "framework" applies X-Forwarded-* so
  # request.isSecure() is correct behind HTTPS. NOTE: the session cookie's
  # Secure flag is NOT derived from that — Tomcat builds JSESSIONID from the
  # raw connector request — hence the static cookie.secure below.
  forward-headers-strategy: framework
  servlet:
    session:
      # Sessions live in memory: a redeploy logs the user out (accepted v1
      # behavior). Long idle timeout so the single user stays logged in.
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        # Static because Tomcat bypasses the forwarded-header wrapper here.
        # Localhost counts as a trustworthy origin, so local dev over http
        # keeps working.
        secure: true
        # Without max-age the browser may drop the cookie on close/eviction
        # long before the 30d server session expires — the phone would ask
        # for the password every morning.
        max-age: 30d

management:
  endpoint:
    health:
      probes:
        enabled: true
