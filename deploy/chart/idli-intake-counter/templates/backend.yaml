{{- /* Fail at render time, not as a CrashLoopBackOff at rollout: the backend
     hard-requires a datasource (since 0.4.0) and its login credential
     (since 0.5.0). */}}
{{- $hasDatasource := false }}
{{- $hasAuth := false }}
{{- range .Values.backend.env }}
{{- if eq .name "SPRING_DATASOURCE_URL" }}{{- $hasDatasource = true }}{{- end }}
{{- if eq .name "IDLI_AUTH_PASSWORD_HASH" }}{{- $hasAuth = true }}{{- end }}
{{- end }}
{{- if not $hasDatasource }}
{{- fail "backend.env must include SPRING_DATASOURCE_URL (plus USERNAME/PASSWORD; see values.yaml) — the backend requires a database since chart 0.4.0" }}
{{- end }}
{{- if not $hasAuth }}
{{- fail "backend.env must include IDLI_AUTH_PASSWORD_HASH (bcrypt; see values.yaml and scripts/mint-auth-hash.sh) — the backend requires its login credential since chart 0.5.0" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idli.fullname" . }}-backend
  labels:
    {{- include "idli.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "idli.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "idli.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        {{- /* Named after the chart, not just "backend": log and metrics
             pipelines label by container name, and a bare "backend" is only
             unique in a cluster by luck. This way the container carries the
             same name as its image — and as the Deployment, when the release
             is named after the chart. Fixed across releases, and well inside
             the 63 characters a container name may have. */}}
        - name: {{ .Chart.Name }}-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          {{- with .Values.backend.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          {{- /* Generous window for datasource init + Flyway before the
               liveness/readiness probes take over. */}}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          {{- /* A failed liveness probe restarts the pod, and a restart drops
               every in-memory session — the most expensive thing a probe can
               do to this app. So it tolerates a busy moment (3 s instead of
               the 1 s default, times the default 3 failures) before concluding
               the process is wedged. Readiness keeps the default: taking a
               slow pod out of rotation costs nothing and heals by itself. */}}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "idli.fullname" . }}-backend
  labels:
    {{- include "idli.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "idli.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
