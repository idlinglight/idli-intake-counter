apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idli.fullname" . }}-frontend
  labels:
    {{- include "idli.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "idli.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "idli.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "idli.podHardening" . | nindent 6 }}
      containers:
        {{- /* Named after the chart — see backend.yaml. */}}
        - name: {{ .Chart.Name }}-frontend
          image: {{ include "idli.image" .Values.frontend.image | quote }}
          securityContext:
            {{- include "idli.containerHardening" . | nindent 12 }}
          ports:
            {{- /* The port the image's nginx listens on (frontend/nginx.conf):
                 8080 since chart 0.6.0, because the image runs as a non-root
                 user. Probe and Service find it by name; the Service itself
                 stays on 80. An image that still listens on 80 never becomes
                 Ready under this chart — see values.yaml. */}}
            - name: http
              containerPort: 8080
          {{- /* /healthz is answered by nginx itself and kept out of its
               access log (frontend/nginx.conf), so probing writes no log
               lines. */}}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            {{- /* nginx keeps its pid file and temp files here; the rest of
                 the filesystem is read-only. */}}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "idli.fullname" . }}-frontend
  labels:
    {{- include "idli.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "idli.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
