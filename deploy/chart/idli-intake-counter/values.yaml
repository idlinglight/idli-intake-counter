backend:
  image:
    repository: ghcr.io/idlinglight/idli-intake-counter-backend
    # Pinned to a concrete sha-<short7> tag by the GitOps consumer.
    tag: sha-0000000
  # Environment for the backend container, passed through verbatim —
  # plain values and valueFrom/secretKeyRef entries both work. The backend
  # REQUIRES two things here or the template fails to render:
  #   * its datasource (SPRING_DATASOURCE_URL; credentials typically from
  #     the CNPG-minted app Secret)
  #   * its login credential (IDLI_AUTH_PASSWORD_HASH, bcrypt — mint with
  #     scripts/mint-auth-hash.sh; from a Secret deliberately named
  #     distinctly from the database one, e.g. idli-auth)
  #   - name: SPRING_DATASOURCE_URL
  #     value: jdbc:postgresql://<host>:5432/idli
  #   - name: SPRING_DATASOURCE_USERNAME
  #     valueFrom: { secretKeyRef: { name: idli-db-app, key: username } }
  #   - name: SPRING_DATASOURCE_PASSWORD
  #     valueFrom: { secretKeyRef: { name: idli-db-app, key: password } }
  #   - name: IDLI_AUTH_PASSWORD_HASH
  #     valueFrom: { secretKeyRef: { name: idli-auth, key: password-hash } }
  env: []
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  image:
    repository: ghcr.io/idlinglight/idli-intake-counter-frontend
    tag: sha-0000000
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

ingress:
  enabled: true
  # Empty string = cluster default ingress class.
  className: ""
  # Passed through verbatim onto the Ingress — e.g. for cert-manager
  # issuer annotations; the chart itself stays controller-agnostic.
  annotations: {}
  host: idli.localtest.me
  # Optional list of ingress TLS blocks, passed through verbatim.
  tls: []
