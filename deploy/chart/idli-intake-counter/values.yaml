backend:
  image:
    repository: ghcr.io/idlinglight/idli-intake-counter-backend
    # Pinned to a concrete sha-<short7> tag by the GitOps consumer.
    tag: sha-0000000
  # Environment for the backend container, passed through verbatim —
  # plain values and valueFrom/secretKeyRef entries both work. The backend
  # REQUIRES its datasource here (the template fails to render without
  # SPRING_DATASOURCE_URL), credentials from an out-of-band Secret:
  #   - name: SPRING_DATASOURCE_URL
  #     value: jdbc:postgresql://<host>:5432/idli
  #   - name: SPRING_DATASOURCE_USERNAME
  #     valueFrom: { secretKeyRef: { name: idli-db, key: username } }
  #   - name: SPRING_DATASOURCE_PASSWORD
  #     valueFrom: { secretKeyRef: { name: idli-db, key: password } }
  env: []
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  image:
    repository: ghcr.io/idlinglight/idli-intake-counter-frontend
    tag: sha-0000000
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

ingress:
  enabled: true
  # Empty string = cluster default ingress class.
  className: ""
  # Passed through verbatim onto the Ingress — e.g. for cert-manager
  # issuer annotations; the chart itself stays controller-agnostic.
  annotations: {}
  host: idli.localtest.me
  # Optional list of ingress TLS blocks, passed through verbatim.
  tls: []
